name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  brokerage-app:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/brokerage
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.1 # matches packageManager in apps/brokerage/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: apps/brokerage/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm check-types
      - run: pnpm test
      - run: pnpm build
